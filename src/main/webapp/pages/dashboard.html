<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/color.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/mensagens.css" />
</head>
<body>
    <header id="header">
        <h1 id="tituloCadastro">Sistema de Estoque</h1>
        <nav id="menu">
            <ul class="menu-lista">
                <li><a href="dashboard.html">Início</a></li>
                <li><a href="gerenciamento.html" class="btn-app">Gerenciamento</a></li>
                <li><a href="cadastro.html" id="btnCadastroFuncionario" class="btn-app">Cadastro</a></li>
                <li><a href="../logout">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="resumoEstoque">
            <div class="card-resumo">
                <h3 class="titulo-card">Entrada</h3>
                <p class="valor-card" id="cardEntrada">0</p>
            </div>

            <div class="card-resumo">
                <h3 class="titulo-card">Saída</h3>
                <p class="valor-card" id="cardSaida">0</p>
            </div>

            <div class="card-resumo">
                <h3 class="titulo-card">Total</h3>
                <p class="valor-card" id="cardTotal">0</p>
            </div>
        </section>

        <section id="filtro">
            <div class="grupo-filtro">
                <label for="filtroData">Vencimento</label>
                <input type="date" id="filtroData" class="input-filtro">
            </div>
            <div class="grupo-filtro">
                <label for="tipoMovimentacao">Tipo</label>
                <select id="tipoMovimentacao" class="select-filtro">
                    <option value="">Todos</option>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div class="grupo-filtro pesquisa-nome">
                <label for="pesquisarNome">Pesquisar item</label>
                <input type="text" id="pesquisarNome" class="input-filtro" placeholder="Digite o nome do item">
            </div>
            <div class="grupo-filtro botao-pesquisa">
                <button type="button" id="btnPesquisar" class="btn-pesquisa">Pesquisar</button>
            </div>
            <div class="topo-tabela">
                <a href="cadastroItens.html" class="btn-add btn-app">Novo Item</a>
            </div>
        </section>

        <section id="tabelaEstoqueContainer">
            <div class="tabela-wrapper">
                <table id="tabelaEstoque">
                    <thead>
                        <tr>
                            <th>Código de barras</th>
                            <th>Nome</th>
                            <th>Fabricante</th>
                            <th>Marca</th>
                            <th>Data Fabricação</th>
                            <th>Data Vencimento</th>
                            <th>Quantidade</th>
                            <th>Valor unitário</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                    </tbody>
                </table>
            </div>
        </section>
        <section id="paginacao">
            <div class="controle-paginacao">
                <label for="pagina">Página</label>
                <select id="pagina">
                    <option value="1">1</option>
                </select>
            </div>
            <div class="conteiner-btn">
                <button type="button" id="btnVoltar" class="btn-voltar">Voltar</button>
                <button type="button" id="btnProximo" class="btn-proximo">Próximo</button>
            </div>
        </section>
    </main>
    <script src="../js/util.js"></script>
    <script src="../js/mensagens.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/validarLogin.js"></script>
</body>
</html>
