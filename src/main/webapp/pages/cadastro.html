<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/color.css"/>
        <link rel="stylesheet" href="../css/cadastro.css">
        <link rel="stylesheet" href="../css/mensagens.css"/>
        <title>Cadastro</title>
    </head>
    <body>
         <header id="header">
            <h1 id="tituloCadastro">Cadastro de Funcionários </h1>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Inicio</a></li>
                    <li><a href="gerenciamento.html">Gerenciamento</a></li>
                    <li><a href="cadastroItens.html">Cadastro de Itens</a></li>
                </ul>
            </nav>
        </header>
        <main id="main" >
            <form action="cadastro" method="POST">
                <div class="container">
                    <div class="dadosPessoais">
                        <label for="nameFirst">NOME</label>
                        <input type="text" name="nameFirst" id="nameFirst" pattern="[A-Za-zÀ-ÿ ]+" placeholder="Digite o seu nome aqui:" title="Por favor, use apenas letras, sem símbolos ou emojis!" required />
                        <label for="sobreNome">SOBRENOME</label>
                        <input type="text" name="sobreNome" id="sobreNome" pattern="[A-Za-zÀ-ÿ ]+" placeholder="Digite o seu sobrenome aqui:" title="Por favor, use apenas letras, sem símbolos ou emojis!" required/>
                        <label for="matricula">MATRICULA</label>
                        <input type="text" name="matricula" id="matricula" pattern="[0-9]+" placeholder="Digite a sua matricula aqui:" title="Use apenas letras e números, sem espaços ou símbolos" required/>
                        <label for="cpf">CPF</label>
                        <input type="text" name="cpf" id="cpf" pattern="[0-9]+" title="Por favor, use apenas números!" placeholder="Digite o seu CPF aqui:" required/>
                        <p>Sexo</p>
                        <select name="opcao" id="opcao">
                            <option value="">Selecione o sexo</option>
                            <option value="1">Masculino</option>
                            <option value="2">Feminino</option>
                        </select>
                        <label for="dtaNascimento">Data de Nascimento</label>
                        <input type="date" name="dtaNascimento" id="dtaNascimento" required/>
                        <label for="email">E-MAIL</label>
                        <input type="email" name="email" id="email" placeholder="Digite o seu E-mail aqui:" required/>
                        <label for="telefone">TELEFONE</label>
                        <input type="tel" name="telefone" id="telefone" placeholder="(00)0 0000-0000" pattern="[0-9()\-\s]+" required/>
                        <label for="usuario">USUÁRIO</label>
                        <input type="text" name="usuario" id="usuario" placeholder="Digite o seu usuário aqui:" pattern="[A-Za-z0-9]+" title="Use apenas números, parênteses, hífen e espaço" required/>
                        <label for="senha">SENHA</label>
                        <input type="password" name="senha" id="senha" placeholder="Digite a sua senha aqui:" required/>
                        <label for="funcao">FUNÇÃO</label>
                        <select name="funcao" id="funcao" required>
                            <option value="">Selecione a função</option>
                            <option value="ADMIN">Admin</option>
                            <option value="GERENTE">Gerente</option>
                            <option value="FUNCIONARIO">Funcionário</option>
                            <option value="VISITANTE">Visitante</option>
                        </select>
                    </div>
                    <div class="containerEndereco">
                        <label for="cep">CEP</label>
                        <input type="text" name="cep" id="cep"  required/>
                        <label for="endereco">ENDEREÇO</label>
                        <input type="text" name="endereco" id="endereco" pattern="[A-Za-zÀ-ÿ0-9 ]+" title="Use apenas letras e números, sem símbolos ou emojis" required/>
                        <label for="cidade">CIDADE</label>
                        <input type="text" name="cidade" id="cidade" pattern="[A-Za-zÀ-ÿ ]+" title="Use apenas letras, sem números, símbolos ou emojis" required/>
                        <label for="bairro">BAIRRO</label>
                        <input type="text" name="bairro" id="bairro" pattern="[A-Za-zÀ-ÿ0-9 ]+" title="Use apenas letras e números, sem símbolos ou emojis" required/>
                        <label for="estado">ESTADO</label>
                        <input type="text" name="estado" id="estado" pattern="[A-Za-zÀ-ÿ ]+" title="Use apenas letras, sem números, símbolos ou emojis" required/>
                        <label for="numero">NÚMERO</label>
                        <input type="text" name="numero" id="numero" pattern="[A-Za-z0-9\-\/]+" title="Digite o número do endereço (ex: 98, 98A, S/N)"
                               placeholder="Ex: 98, 98A ou S/N" required/>
                        <label for="complemento">COMPLEMENTO</label>
                        <input type="text" name="complemento" id="complemento" pattern="[A-Za-zÀ-ÿ0-9 ]*" title="Use apenas letras e números, sem símbolos ou emojis" placeholder="Digite o seu complemento aqui:"/>
                    </div>
                    <div class="btn">
                        <button type="submit">Cadastrar</button>
                    </div>
                </div>
            </form>
        </main>
        <script src="../js/cep.js"></script>
        <script src="../js/mensagens.js"></script>
    </body>
</html>
