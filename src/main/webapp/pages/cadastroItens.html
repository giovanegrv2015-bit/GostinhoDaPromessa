<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Item</title>
        <link rel="stylesheet" href="../css/reset.css" />
        <link rel="stylesheet" href="../css/color.css" />
        <link rel="stylesheet" href="../css/layout.css" />
        <link rel="stylesheet" href="../css/cadastroItens.css"/>
        <link rel="stylesheet" href="../css/mensagens.css" />
    </head>
    <body>
        <header id="header">
            <h1 id="tituloCadastro">Sistema de Estoque</h1>
            <nav id="menu">
                <ul class="menu-lista">
                    <li><a href="dashboard.html">Início</a></li>
                    <li><a href="gerenciamento.html" class="btn-app">Gerenciamento</a></li>
                    <li><a href="cadastro.html" id="btnCadastroFuncionario" class="btn-app">Cadastro</a></li>
                    <li><a href="../logout">Sair</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id ="form-container">
                <form action="../cadastroItens" method="POST" id="formCadastro">
                    <div class="linha-form">
                    <div class="grupo-form">
                        <label for="codigoBarras">Código de Barras</label>
                        <input type="text" inputmode="numeric" maxlength="100" title="USE APENAS NÚMEROS!" pattern="[0-9]+" name="codigoBarras" id="codigoBarras" placeholder="Digite o código de barras aqui:" required />
                    </div>
                    <div class="grupo-form">
                        <label for="nomeItem" >Nome do Item</label>
                        <input type="text" title="USE APENAS LETRAS, SEM SÍMBOLOS OU EMOJIS!" pattern="[A-Za-zÀ-ÿ0-9 \-\/]+" maxlength="100" name="nomeItem" id="nomeItem" placeholder="Digite o nome do item aqui:" required />
                    </div>
                    </div>

                    <div class="linha-form">
                    <div class="grupo-form">
                        <label for="fabricante" >Fabricante</label>
                        <input type="text" title="USE APENAS LETRAS, SEM SÍMBOLOS OU EMOJIS!" pattern="[A-Za-zÀ-ÿ0-9 ]+" maxlength="100" name="fabricante" id="fabricante" placeholder="Digite o nome do fabricante aqui:" required />
                    </div>
                    <div class="grupo-form">
                        <label for="marca" >Marca</label>
                        <input type="text" title="USE APENAS LETRAS, SEM SÍMBOLOS OU EMOJIS!" pattern="[A-Za-zÀ-ÿ0-9 ]+"  maxlength="100" name="marca" id="marca" placeholder="Digite o nome da marca aqui:" required />
                    </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="dataFabricacao" >Data de Fabricação</label>
                            <input type="date" name="dataFabricacao" id="dataFabricacao" min="2000-01-01" required />
                        </div>

                        <div class="grupo-form">
                            <label for="dataVencimento" >Data de Vencimento</label>
                            <input type="date" name="dataVencimento" id="dataVencimento" required />
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="quantidade" >Quantidade</label>
                            <input type="number" name="quantidade" id="quantidade" min="0" required/>
                        </div>

                        <div class="grupo-form">
                            <label for="valor" >Valor Unitário</label>
                            <input type="text" inputmode="decimal" name="valor" pattern="[0-9]+([.,][0-9]{1,2})?" title="Use vírgula ou ponto para os centavos (ex: 5,50 ou 5.50)" id="valor" placeholder="Ex: 5,50" required/>
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="total">Total</label>
                            <input type="text" id="total" value="0,00" readonly tabindex="-1" />
                        </div>
                        <div class="grupo-form">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="entrada">Entrada</option>
                                <option value="saida">Saída</option>
                            </select>
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="local">Local de Armazenamento</label>
                            <select name="local" id="local" required>
                                <option value="">Selecione o Local</option>
                                <option value="Freezer">Freezer</option>
                                <option value="Refrigerador">Refrigerador</option>
                                <option value="Prateleira">Prateleira</option>
                            </select>
                        </div>
                        <div class="grupo-form">
                            <label for="categoria">Categoria</label>
                            <select name="categoria" id="categoria" required>
                                <option value="">Selecione a categoria</option>
                                <option value="Matéria Prima">Matéria Prima</option>
                                <option value="Produto Final">Produto Final</option>
                                <option value="Embalagens">Embalagens</option>
                            </select>
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="estoqueMinimo">Estoque Mínimo</label>
                            <input type="number" title="USE APENAS NÚMEROS!" name="estoqueMinimo" id="estoqueMinimo" min="0" placeholder="Qtd. mínima do alerta" required/>
                        </div>
                    </div>

                    <div class="acoes-form">
                        <button type="submit" class="btn-salvar">Salvar</button>
                        <a href="dashboard.html" class="btn-cancelar">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
        <script src="../js/util.js"></script>
        <script src="../js/mensagens.js"></script>
        <script src="../js/cadastroItens.js"></script>
        <script src="../js/validarLogin.js"></script>
    </body>
</html>
