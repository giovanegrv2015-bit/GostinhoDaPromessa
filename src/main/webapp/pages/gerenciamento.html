<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerenciamento</title>
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/color.css"/>
        <link rel="stylesheet" href="../css/layout.css"/>
        <link rel="stylesheet" href="../css/gerenciamento.css"/>
        <link rel="stylesheet" href="../css/mensagens.css"/>
    </head>
    
    <body>
        <header id="header">
            <h1 id="tituloCadastro">Sistema de Estoque</h1>
            <nav id="menu">
                <ul class="menu-lista">
                    <li><a href="dashboard.html">Início</a></li>
                    <li><a href="gerenciamento.html" class="btn-app">Gerenciamento</a></li>
                    <li><a href="cadastro.html" id="btnCadastroFuncionario" class="btn-app">Cadastro</a></li>
                    <li><a href="../logout">Sair</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="secaoItens">
                <div class="secao-topo">
                    <h2 class="secao-titulo">Itens em Estoque</h2>
                    <div class="barra-acoes">
                        <input type="text" id="buscarGerenciamento" class="input-busca" placeholder="Buscar item pelo nome">
                        <a href="cadastroItens.html" class="btn-novo-item">Novo Item</a>
                    </div>
                </div>
                <div id="listaItens" class="lista-itens">
                    <div class="loading-msg">Carregando itens...</div>
                </div>
            </section>
        </main>

        <div id="modalOverlay" class="modal-overlay" hidden>
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modalTitulo">Editar Item</h3>
                    <button type="button" class="modal-fechar" id="btnFecharModal" aria-label="Fechar">&times;</button>
                </div>
                <form id="formEdicao" class="modal-body">
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-nomeItem">Nome do Item</label>
                            <input type="text" id="modal-nomeItem" maxlength="100" pattern="[A-Za-zÀ-ÿ0-9 \-\/]+" title="USE APENAS LETRAS, SEM SÍMBOLOS OU EMOJIS!" required/>
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-fabricante">Fabricante</label>
                            <input type="text" id="modal-fabricante" maxlength="100" pattern="[A-Za-zÀ-ÿ0-9 ]+" title="USE APENAS LETRAS, SEM SÍMBOLOS OU EMOJIS!"/>
                        </div>
                        <div class="grupo-form">
                            <label for="modal-marca">Marca</label>
                            <input type="text" id="modal-marca" maxlength="100" pattern="[A-Za-zÀ-ÿ0-9 ]+" title="USE APENAS LETRAS, SEM SÍMBOLOS OU EMOJIS!"/>
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-dataFabricacao">Data de Fabricação</label>
                            <input type="date" id="modal-dataFabricacao" min="2000-01-01"/>
                        </div>
                        <div class="grupo-form">
                            <label for="modal-dataVencimento">Data de Vencimento</label>
                            <input type="date" id="modal-dataVencimento"/>
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-quantidade">Quantidade</label>
                            <input type="number" id="modal-quantidade" min="0" step="1" required/>
                        </div>
                        <div class="grupo-form">
                            <label for="modal-valor">Valor Unitário</label>
                            <input type="text" inputmode="decimal" id="modal-valor" required pattern="[0-9]+([.,][0-9]{1,2})?" title="Use vírgula ou ponto para os centavos (ex: 5,50 ou 5.50)"/>
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-total">Total</label>
                            <input type="text" id="modal-total" disabled class="input-disabled"/>
                        </div>
                        <div class="grupo-form">
                            <label for="modal-status">Status</label>
                            <select id="modal-status">
                                <option value="entrada">Entrada</option>
                                <option value="saida">Saída</option>
                            </select>
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-local">Local de Armazenamento</label>
                            <select id="modal-local" required>
                                <option value="Freezer">Freezer</option>
                                <option value="Refrigerador">Refrigerador</option>
                                <option value="Prateleira">Prateleira</option>
                            </select>
                        </div>
                        <div class="grupo-form">
                            <label for="modal-categoria">Categoria</label>
                            <select id="modal-categoria" required>
                                <option value="Matéria Prima">Matéria Prima</option>
                                <option value="Produto Final">Produto Final</option>
                                <option value="Embalagens">Embalagens</option>
                            </select>
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="modal-estoqueMinimo">Estoque Mínimo</label>
                            <input type="number" id="modal-estoqueMinimo" min="0" step="1" required/>
                        </div>
                    </div>
                </form>
                <div class="modal-footer">
                    <button type="button" id="btnSalvarEdicao" class="btn-salvar">Salvar Alterações</button>
                    <button type="button" id="btnExcluirItem" class="btn-excluir">Excluir Item</button>
                    <button type="button" id="btnCancelarModal" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>

        <script src="../js/util.js"></script>
        <script src="../js/mensagens.js"></script>
        <script src="../js/gerenciamento.js"></script>
        <script src="../js/validarLogin.js"></script>
    </body>
</html>
