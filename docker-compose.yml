services:
  db:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      # 127.0.0.1 = o MySQL só atende a própria máquina (IntelliJ, DBeaver...).
      # Sem isso, num servidor na internet a porta do banco (com usuário root) fica aberta para o mundo.
      - "127.0.0.1:${DB_PORT_EXTERNAL}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # A PASTA inteira, com caminho relativo. O init.sql só roda quando o volume db_data é criado.
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1 força TCP. Com "localhost" o teste usa o socket e passa cedo demais: durante a
      # primeira inicialização o MySQL sobe um servidor temporário que ainda não aceita conexões do app.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    container_name: app-estoque
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=America/Bahia
      - DB_URL=jdbc:mysql://db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - DB_USER=${DB_USER}
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      # Usuários iniciais (ver util/UsuariosIniciais.java). ":-" = vazio se não estiver no .env
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SEED_DEMO=${SEED_DEMO:-false}

volumes:
  db_data:
